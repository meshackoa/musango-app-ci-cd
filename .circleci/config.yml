version: 2.1

orbs:
  node: circleci/node@5.0.2
  docker: circleci/docker@2.4.0
  aws-cli: circleci/aws-cli@5.1.0
  kubernetes: circleci/kubernetes@1.3.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.16
      - image: mongo:6.0
    working_directory: ~/musango-app

jobs:
  install:
    executor: node-executor
    steps:
      - checkout
      - run: npm install
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  test:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Wait for MongoDB to be ready
          command: |
            dockerize -wait tcp://localhost:27017 -timeout 30s
      - run:
          name: Run Tests
          command: |
            export MONGO_URI="mongodb://localhost:27017/musango-express"
            npm test

  run_app:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run App Locally
          command: |
            export MONGO_URI="mongodb://localhost:27017/musango-express"
            node app.js &
            sleep 10
            curl --fail http://localhost:8080/health || exit 1

  build_and_push:
    docker:
      - image: cimg/node:18.16
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Set Image Tag
          command: |
            echo "IMAGE_TAG=$(date +%Y-%m-%d)-$(echo $CIRCLE_BRANCH | sed 's/[^a-zA-Z0-9]/-/g')-$(git rev-parse --short HEAD)" >> $BASH_ENV
      - run:
          name: Build Docker Image
          command: |
            source $BASH_ENV
            docker build -t meshackoa/musango:$IMAGE_TAG .
      - run:
          name: Push Docker Image
          command: |
            source $BASH_ENV
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker push meshackoa/musango:$IMAGE_TAG
      - run:
          name: Save Image Tag
          command: |
            source $BASH_ENV
            echo "$IMAGE_TAG" > image-tag.txt
      - persist_to_workspace:
          root: .
          paths:
            - image-tag.txt

  deploy_dev:
    docker:
      - image: cimg/node:18.16
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/setup
      - kubernetes/install-kubectl
      - run:
          name: Configure EKS
          command: |
            aws eks update-kubeconfig \
              --region us-east-1 \
              --name landmark-eks
      - run:
          name: Deploy to Development
          command: |
            IMAGE_TAG=$(cat image-tag.txt)

            kubectl create namespace development --dry-run=client -o yaml | kubectl apply -f -

            sed -i 's/namespace: .*/namespace: development/g' kubernetes/deployment/mongo.yaml
            sed -i 's/namespace: .*/namespace: development/g' kubernetes/deployment/musango.yaml
            sed -i "s|image: .*|image: meshackoa/musango:$IMAGE_TAG|g" kubernetes/deployment/musango.yaml

            kubectl apply -f kubernetes/deployment/mongo.yaml
            kubectl apply -f kubernetes/deployment/musango.yaml
            kubectl rollout status deployment/musango -n development
    
  deploy_staging:
    docker:
      - image: cimg/node:18.16
    steps:
      - checkout
      - attach_workspace:
          at: .      
      - aws-cli/setup
      - kubernetes/install-kubectl
      - run:
          name: Configure EKS
          command: |
            aws eks update-kubeconfig \
              --region us-east-1 \
              --name landmark-eks
      - run:
          name: Deploy to Staging
          command: |
            IMAGE_TAG=$(cat image-tag.txt)
            kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
            sed -i 's/namespace: .*/namespace: staging/g' kubernetes/deployment/mongo.yaml
            sed -i 's/namespace: .*/namespace: staging/g' kubernetes/deployment/musango.yaml
            sed -i "s|image: .*|image: meshackoa/musango:$IMAGE_TAG|g" kubernetes/deployment/musango.yaml
            kubectl apply -f kubernetes/deployment/mongo.yaml
            kubectl apply -f kubernetes/deployment/musango.yaml
            kubectl rollout status deployment/musango -n staging
  
  deploy_prod:
    docker:
      - image: cimg/node:18.16
    steps:
      - checkout
      - attach_workspace:
          at: .
      - aws-cli/setup
      - kubernetes/install-kubectl
      - run:
          name: Configure EKS
          command: |
            aws eks update-kubeconfig \
              --region us-east-1 \
              --name landmark-eks
      - run:
          name: Deploy to Production
          command: |
            IMAGE_TAG=$(cat image-tag.txt)
            kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
            sed -i 's/namespace: .*/namespace: production/g' kubernetes/deployment/mongo.yaml
            sed -i 's/namespace: .*/namespace: production/g' kubernetes/deployment/musango.yaml
            sed -i "s|image: .*|image: meshackoa/musango:$IMAGE_TAG|g" kubernetes/deployment/musango.yaml
            kubectl apply -f kubernetes/deployment/mongo.yaml
            kubectl apply -f kubernetes/deployment/musango.yaml
            kubectl rollout status deployment/musango -n production

workflows:
  version: 2
  musango_ci_pipeline:
    jobs:
      - install

      - test:
          requires:
            - install

      - run_app:
          requires:
            - test

      - build_and_push:
          requires:
            - run_app

      - deploy_dev:
          context: development
          requires:
            - build_and_push
          filters:
            branches:
              only: develop

      - deploy_staging:
          context: staging
          requires:
            - build_and_push
          filters:
            branches:
              only: /^release.*/

      - deploy_prod:
          context: production
          requires:
            - build_and_push
          filters:
            branches:
              only:
                - main