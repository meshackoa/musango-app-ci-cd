apiVersion: apps/v1
kind: Deployment
metadata:
  name: musango
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musango
  template:
    metadata:
      labels:
        app: musango
    spec:
      containers:
        - name: musango
          image: meshackoa/musango:latest
          ports:
            - containerPort: 8082
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/musango-express"
            - name: PORT
              value: "8082"

---
apiVersion: v1
kind: Service
metadata:
  name: musango
  namespace: development
spec:
  type: NodePort
  selector:
    app: musango
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30012